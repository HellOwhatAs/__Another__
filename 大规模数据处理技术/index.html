<!DOCTYPE html>
<html>

<head>
    <title>大规模数据处理技术</title>
    <style>
        /* 基础样式 - 适用于所有情况 */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 竖屏样式 (默认) */
        @media (orientation: portrait) {
            body {
                width: 100%;
                /* 全屏宽度 */
                padding: 0 10px;
                /* 可选：添加小量边距防止贴边 */
            }

            /* 可选：隐藏横向滚动条 */
            html {
                overflow-x: hidden;
            }
        }

        /* 横屏样式 */
        @media (orientation: landscape) {
            body {
                max-width: 900px;
                /* 根据内容需要调整 */
                margin: 0 auto;
                /* 左右自动居中 */
                padding: 0 20px;
                /* 保持内容呼吸空间 */
            }
        }

        /* 移动端优化 */
        @media (max-width: 768px) {
            /* 横屏时适当缩小最大宽度 */
            @media (orientation: landscape) {
                body {
                    max-width: 90vw;
                    /* 相对视口宽度 */
                    padding: 0 15px;
                }
            }
        }
    </style>
</head>

<body style="background-color: #666;">
    <script>
        for (i = 1; i <= 18; i++) {
            var img = document.createElement("img");
            img.src = "./res" + i + ".svg";
            img.style.width = "100%";
            document.body.appendChild(img);
            document.body.appendChild(document.createElement("br"));
        }
    </script>
</body>

</html>
